<head>

<title>Contraloría de resultados críticos — Clínica Cruz Nacional</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style id="estiloPagina">@page{size:letter landscape;margin:10mm}</style>
<style>
:root{--azul:#0066CC;--navy:#003366;--bg:#F7F9FC;--borde:#E2E8F0;--texto:#1E293B;--gris:#64748B;--ok:#10B981;--mal:#DC2626;--cumple:#1F5FAD;--nocumple:#C00000}
*{box-sizing:border-box}
body{margin:0;font-family:'Carlito',Calibri,Arial,sans-serif;font-size:15px;color:var(--texto);background:var(--bg)}
h1,h2,h3,h4{font-family:'DM Sans',Arial,sans-serif;color:var(--navy);margin:0 0 .5rem}
header{background:var(--navy);color:#fff;padding:.7rem 1.2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
header h1{color:#fff;font-size:1.15rem;margin:0}
header .ctx{margin-left:auto;font-size:.9rem;opacity:.9}
main{max-width:1440px;margin:0 auto;padding:1.2rem}
.tabs{display:flex;gap:.3rem;border-bottom:2px solid var(--borde);margin-bottom:1rem;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:.6rem 1rem;font-weight:700;color:var(--gris);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;font-family:inherit;font-size:.95rem}
.tabs button.on{color:var(--azul);border-color:var(--azul)}
.tabs button:disabled{opacity:.4;cursor:not-allowed}
.subtabs{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0}
.subtabs button{border:1px solid var(--borde);background:#fff;border-radius:999px;padding:.35rem .9rem;cursor:pointer;font-weight:700;font-family:inherit;color:var(--gris)}
.subtabs button.on{background:var(--azul);border-color:var(--azul);color:#fff}
.card{background:#fff;border:1px solid var(--borde);border-radius:10px;padding:1.1rem;margin-bottom:1rem}
.row{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--azul);background:var(--azul);color:#fff;border-radius:8px;padding:.45rem .9rem;cursor:pointer;font-weight:700;font-family:inherit;font-size:.9rem}
.btn.sec{background:#fff;color:var(--azul)}
.btn.peligro{background:#fff;color:var(--mal);border-color:var(--mal)}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select{padding:.4rem .5rem;border:1px solid var(--borde);border-radius:6px;font-family:inherit;font-size:.9rem}
label{font-weight:700;font-size:.85rem;color:var(--gris)}
.muted{color:var(--gris)}.small{font-size:.85rem}
.err{color:var(--mal);font-weight:700;margin-top:.5rem}
.notice{background:#FEF3C7;border:1px solid #FDE68A;border-radius:8px;padding:.6rem .8rem;font-size:.9rem;margin:.6rem 0}
.ok-msg{background:#D1FAE5;border:1px solid #A7F3D0;border-radius:8px;padding:.6rem .8rem;font-size:.9rem;margin:.6rem 0}
.tabla{overflow:auto;max-height:70vh;border:1px solid var(--borde);border-radius:8px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.85rem}
th{background:#E6EEF8;color:var(--navy);position:sticky;top:0;z-index:2;text-align:left;font-family:'DM Sans',Arial,sans-serif;font-size:.78rem;padding:.45rem;white-space:nowrap;border-bottom:1px solid var(--borde)}
td{padding:.35rem .45rem;border-bottom:1px solid var(--borde);white-space:nowrap;background:#fff}
.revision tbody tr:nth-child(even) td{background:#F8FAFC}
.revision tbody tr:hover td{background:#E0F2FE}
td.total{font-weight:700;background:#F1F5F9!important}
.celda-ev{display:inline-block;min-width:100px;text-align:center;font-weight:700;font-size:.78rem;border-radius:4px;padding:.3rem .2rem;cursor:pointer;user-select:none;border:1px dashed #CBD5E1;color:#94A3B8;background:#fff}
.celda-ev.c{background:var(--cumple);color:#fff;border-color:var(--cumple)}
.celda-ev.n{background:var(--nocumple);color:#fff;border-color:var(--nocumple)}
.celda-ev.pend{border:2px solid var(--mal);background:#FEF2F2;color:var(--mal)}
.celda-ev.bloq{cursor:default}
.badge{display:inline-block;padding:.12rem .55rem;border-radius:999px;font-size:.78rem;font-weight:700}
.b-ok{background:#D1FAE5;color:#065F46}.b-mal{background:#FEE2E2;color:#991B1B}.b-neutral{background:#F1F5F9;color:#475569}.b-cerrada{background:#E0E7FF;color:#3730A3}
.kpi{font-family:'DM Sans',Arial,sans-serif;font-size:1.3rem;font-weight:700;color:var(--navy)}
#impresion{display:none}
@media print{
  body{background:#fff}
  header,main{display:none!important}
  #impresion{display:block!important}
}
.doc{font-family:'Carlito',Calibri,Arial,sans-serif;color:#1E293B;width:258mm;font-size:10.5pt}
.doc h2{font-size:15pt;margin:.2rem 0}
.doc h3{font-size:12pt;margin:.7rem 0 .3rem;break-after:avoid}
.doc table{border-collapse:collapse;width:100%;font-size:9.5pt}
.doc th,.doc td{border:1px solid #CBD5E1;padding:3px 5px;white-space:normal;position:static;background:#fff}
.doc th{background:#E6EEF8;color:#003366;font-family:'DM Sans',Arial,sans-serif}
.doc tr{break-inside:avoid}
.doc .cn{background:#C00000;color:#fff;font-weight:700;text-align:center}
.doc .cc{text-align:center}
.doc td.total{background:#F1F5F9}
</style>
</head>

    const v = String(valor ?? '').replace(/[\[\]]/g, '').trim();
    let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);
    if (m){ fecha = [+m[1], +m[2], +m[3]]; if (m[4]) hora = `${pad(m[4])}:${m[5]}`; }
    else if ((m = v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:\s+(\d{1,2}):(\d{2}))?/))){ const y = +m[3] < 100 ? 2000 + +m[3] : +m[3]; fecha = [y, +m[2], +m[1]]; if (m[4]) hora = `${pad(m[4])}:${m[5]}`; }
  }
  if (horaAparte !== undefined && horaAparte !== null && horaAparte !== ''){
    if (typeof horaAparte === 'number'){ const seg = Math.round((horaAparte % 1) * 86400); hora = `${pad(Math.floor(seg / 3600))}:${pad(Math.floor(seg % 3600 / 60))}`; }
    else { const mh = String(horaAparte).match(/(\d{1,2}):(\d{2})/); if (mh) hora = `${pad(mh[1])}:${mh[2]}`; }
  }
  if (!fecha) return {texto:String(valor ?? ''), iso:'', hora:''};
  return {texto:`${pad(fecha[2])}/${pad(fecha[1])}/${fecha[0]}${hora ? ' ' + hora : ''}`, iso:`${fecha[0]}-${pad(fecha[1])}-${pad(fecha[2])}`, hora};
}
function limite48(f){
  if (!f.iso) return '—';
  const [y, m, d] = f.iso.split('-').map(Number);
  if (f.hora){ const [h, mi] = f.hora.split(':').map(Number); const t = new Date(y, m - 1, d, h, mi); t.setHours(t.getHours() + 48); return `${pad(t.getDate())}/${pad(t.getMonth()+1)}/${t.getFullYear()} ${pad(t.getHours())}:${pad(t.getMinutes())}`; }
  const t = new Date(y, m - 1, d); t.setDate(t.getDate() + 2); return `${pad(t.getDate())}/${pad(t.getMonth()+1)}/${t.getFullYear()} (sin hora)`;
}

let almacen = cargar();
let pestana = 'carga', sucursalActiva = null, prestadorActivo = 'rx', mostrarPendientes = false, pendientesAsignar = [], pendientesNombres = [], mensajesCarga = [];
function cargar(){ try { return JSON.parse(localStorage.getItem(CLAVE_ALMACEN)) || {periodos:{}, periodoActual:''}; } catch (e){ console.error(e); return {periodos:{}, periodoActual:''}; } }
function guardar(){ try { localStorage.setItem(CLAVE_ALMACEN, JSON.stringify(almacen)); } catch (e){ console.error(e); alert('No se pudo guardar el avance en este navegador. Usa "Exportar avance".'); } }
const periodo = () => almacen.periodos[almacen.periodoActual];
function sucursalDatos(suc){
  const p = periodo(); p.sucursales[suc] = p.sucursales[suc] || {casos:{}, cerrada:null, historialCierre:[]};
  return p.sucursales[suc];
}
const casosDe = (suc, pr) => periodo()?.sucursales[suc]?.casos[pr] || [];

/* ---------- Lectura de los Excel de los prestadores ---------- */
function filasHoja(libro, nombreHoja){ return XLSX.utils.sheet_to_json(libro.Sheets[nombreHoja], {header:1, raw:true, defval:''}); }
function buscarEncabezado(filas, requeridos){
  for (let i = 0; i < Math.min(filas.length, 25); i++){
    const enc = filas[i].map(norm);
    if (requeridos.every(r => enc.some(h => h.includes(r)))) return {i, enc};
  }
  return null;
}
const col = (enc, ...nombres) => { for (const n of nombres){ const i = enc.findIndex(h => h === n); if (i >= 0) return i; } for (const n of nombres){ const i = enc.findIndex(h => h.includes(n)); if (i >= 0) return i; } return -1; };
const val = (f, i) => i >= 0 ? String(f[i] ?? '').trim() : '';

// Holanda: tabla desde el encabezado hasta la primera fila sin N° de atención (en rechazos, la tabla de "por confirmar" queda fuera)
function leerTablaHolanda(filas, tipo){
  const h = buscarEncabezado(filas, ['ATENCION', 'RUT']); if (!h) return null;
  const e = h.enc;
  const c = {id:col(e, 'N° ATENCION', 'Nº ATENCION', 'N ATENCION', 'ATENCION'), fecha:col(e, 'FECHA ATENC', 'FECHA'), rut:col(e, 'RUT/DNI', 'RUT'), nombre:col(e, 'NOMBRE PACIENTE', 'NOMBRE DEL PACIENTE', 'NOMBRE'),
    examen:col(e, 'PRUEBA', 'EXAMEN'), causa:col(e, 'CAUSA DE RECHAZO', 'CAUSA'), fval:col(e, 'FECHA VALIDAC'), hval:col(e, 'HORA VALIDAC')};
  const casos = [];
  for (let i = h.i + 1; i < filas.length; i++){
    const f = filas[i].slice();
    // Algunas planillas traen la fecha bajo "N° Atención" y el número bajo "Fecha": se corrigen fila por fila
    if (typeof f[c.id] === 'number' && f[c.id] % 1 !== 0 && f[c.id] < 100000 && typeof f[c.fecha] === 'number' && f[c.fecha] % 1 === 0 && f[c.fecha] >= 100000){ const x = f[c.id]; f[c.id] = f[c.fecha]; f[c.fecha] = x; }
    if (!val(f, c.id) || !/\d/.test(val(f, c.id))) break;
    const atencion = leerFechaHora(f[c.fecha]);
    const valid = tipo === 'criticos' && c.fval >= 0 ? leerFechaHora(f[c.fval], c.hval >= 0 ? f[c.hval] : '') : atencion;
    casos.push({id:val(f, c.id), rut:val(f, c.rut), nombre:val(f, c.nombre), examen:val(f, c.examen), causa:tipo === 'rechazos' ? val(f, c.causa) : '',
      fechaAtencion:atencion.texto.split(' ')[0], validacion:tipo === 'criticos' ? valid.texto : '', limite:limite48(valid)});
  }
  return casos;
}
function detectarYLeer(libro, nombreArchivo){
  const hojas = libro.SheetNames;
  // Holanda: hojas de valores críticos y de rechazos
  const hCrit = hojas.find(h => norm(h).includes('CRITIC')), hRech = hojas.find(h => norm(h).includes('RECHAZ'));
  if (hCrit || hRech){
    const res = {prestador:'holanda', sucursalArchivo:sucursalDesde(nombreArchivo), lotes:[]};
    if (hCrit){ const c = leerTablaHolanda(filasHoja(libro, hCrit), 'criticos'); if (c) res.lotes.push({pr:'holanda_criticos', casos:c}); }
    if (hRech){ const c = leerTablaHolanda(filasHoja(libro, hRech), 'rechazos'); if (c) res.lotes.push({pr:'holanda_rechazos', casos:c}); }
    return res;
  }
  for (const hoja of hojas){
    const filas = filasHoja(libro, hoja);
    let h = buscarEncabezado(filas, ['RUT_PACIENTE', 'CLIENTE']);
    if (h){ // TAAG
      const e = h.enc, c = {nom:col(e, 'NOMBRE_PACIENTE'), ape:col(e, 'APELLIDOS_PACIENTE'), rut:col(e, 'RUT_PACIENTE'), toma:col(e, 'FECHA_TOMA'), res:col(e, 'FECHA_RESULTADO'), cli:col(e, 'CLIENTE')};
      const casos = filas.slice(h.i + 1).filter(f => val(f, c.rut) || val(f, c.nom)).map((f, k) => { const r = leerFechaHora(f[c.res]);
        return {id:String(k + 1), rut:val(f, c.rut), nombre:`${val(f, c.nom)} ${val(f, c.ape)}`.trim(), examen:'PCR', causa:'', fechaAtencion:leerFechaHora(f[c.toma]).texto.split(' ')[0], tomaIso:leerFechaHora(f[c.toma]).iso, validacion:r.texto, limite:limite48(r), sucursal:sucursalDesde(val(f, c.cli)), origen:val(f, c.cli)}; });
      return {prestador:'taag', lotes:[{pr:'taag', casos}]};
    }
    h = buscarEncabezado(filas, ['OT', 'ID_PATIENT', 'INSTITUCION']);
    if (h){ // DesertHealth
      const e = h.enc, c = {ot:col(e, 'OT'), nom:col(e, 'NOMBRE'), rut:col(e, 'ID_PATIENT'), inst:col(e, 'INSTITUCION'), tit:col(e, 'TITULO'), fest:col(e, 'FECHA_ESTUDIO'), finf:col(e, 'FECHA_INFORME')};
      const casos = filas.slice(h.i + 1).filter(f => val(f, c.ot)).map(f => { const r = leerFechaHora(f[c.finf]);
        return {id:val(f, c.ot), rut:val(f, c.rut), nombre:val(f, c.nom), examen:val(f, c.tit), causa:'', fechaAtencion:leerFechaHora(f[c.fest]).texto.split(' ')[0], validacion:r.texto, limite:limite48(r), sucursal:sucursalDesde(val(f, c.inst)), origen:val(f, c.inst)}; });
      return {prestador:'eco', lotes:[{pr:'eco', casos}]};
    }
    h = buscarEncabezado(filas, ['FOLIO', 'ESTABLECIMIENTO']);
    if (h){ // Atrys
      const e = h.enc, c = {folio:col(e, 'FOLIO'), est:col(e, 'ESTABLECIMIENTO'), rut:col(e, 'RUT'), pac:col(e, 'PACIENTE'), t0:col(e, 'TIEMPO 0'), fval:col(e, 'FECHA VALIDACION')};
      const casos = filas.slice(h.i + 1).filter(f => val(f, c.folio)).map(f => { const r = leerFechaHora(f[c.fval]);
        return {id:val(f, c.folio), rut:val(f, c.rut), nombre:val(f, c.pac), examen:'Radiografía', causa:'', fechaAtencion:leerFechaHora(f[c.t0]).texto.split(' ')[0], validacion:r.texto, limite:limite48(r), sucursal:sucursalDesde(val(f, c.est)), origen:val(f, c.est)}; });
      return {prestador:'rx', lotes:[{pr:'rx', casos}]};
    }
  }
  return null;
}
// Incorpora casos conservando las marcas de los que ya estaban (mismo prestador, identificador y RUT)
function incorporar(suc, pr, casos){
  const s = sucursalDatos(suc);
  const previos = new Map((s.casos[pr] || []).map(c => [`${c.id}|${norm(c.rut)}`, c]));
  s.casos[pr] = casos.map(c => { const p = previos.get(`${c.id}|${norm(c.rut)}`); return {id:c.id, rut:c.rut, nombre:c.nombre, examen:c.examen, causa:c.causa, fechaAtencion:c.fechaAtencion, validacion:c.validacion, limite:c.limite,
    alerta:p?.alerta || '', seguimiento:p?.seguimiento || '', obs:p?.obs || ''}; });
}
async function cargarArchivos(archivos){
  if (!almacen.periodoActual){ alert('Primero elige o crea el período (mes) de trabajo.'); return; }
  if (typeof XLSX === 'undefined'){ alert('No se pudo cargar el lector de Excel. Revisa la conexión a internet y vuelve a abrir la herramienta.'); return; }
  mensajesCarga = [];
  for (const archivo of archivos){
    try {
      const libro = XLSX.read(await archivo.arrayBuffer(), {type:'array', cellDates:false});
      const r = detectarYLeer(libro, archivo.name);
      if (!r){ mensajesCarga.push({ok:false, texto:`${archivo.name}: no se reconoció el formato (Holanda, TAAG, DesertHealth o Atrys).`}); continue; }
      if (r.prestador === 'holanda'){
        if (!r.sucursalArchivo){ pendientesAsignar.push({archivo:archivo.name, lotes:r.lotes}); mensajesCarga.push({ok:false, texto:`${archivo.name}: no se reconoció la sucursal en el nombre del archivo. Elígela abajo.`}); continue; }
        aplicarHolanda(r.sucursalArchivo, r.lotes, archivo.name);
      } else {
        const lote = r.lotes[0];
        let excluidos = 0;
        if (lote.pr === 'taag'){
          const total = lote.casos.length;
          lote.casos = lote.casos.filter(c => (c.tomaIso || '').slice(0, 7) === almacen.periodoActual);
          excluidos = total - lote.casos.length;
        }
        procesarLote(archivo.name, lote, excluidos);
      }
    } catch (e){ console.error(e); mensajesCarga.push({ok:false, texto:`${archivo.name}: no se pudo leer (${e.message}).`}); }
  }
  guardar(); render();
}
function procesarLote(nombre, lote, excluidos = 0){
  lote.casos.forEach(c => { c.sucursal = sucursalDesde(c.origen); });
  const porSucursal = {};
  lote.casos.filter(c => c.sucursal).forEach(c => { (porSucursal[c.sucursal] = porSucursal[c.sucursal] || []).push(c); });
  sucursalesDelPeriodoCarga(Object.keys(porSucursal)).forEach(s => incorporar(s, lote.pr, porSucursal[s] || []));
  registrarArchivo(nombre, lote.pr, Object.entries(porSucursal).map(([s, l]) => `${s}: ${l.length}`).join(' · '));
  const desconocidos = [...new Set(lote.casos.filter(c => !c.sucursal).map(c => c.origen))];
  pendientesNombres = pendientesNombres.filter(p => !(p.archivo === nombre && p.lote.pr === lote.pr));
  if (desconocidos.length) pendientesNombres.push({archivo:nombre, lote, desconocidos});
  mensajesCarga = mensajesCarga.filter(m => !m.texto.startsWith(nombre + ' →'));
  mensajesCarga.push({ok:!desconocidos.length, texto:`${nombre} → ${PRESTADORES[lote.pr].nombre}: ${lote.casos.length} caso(s)${lote.pr === 'taag' ? ` de ${mesLegible(almacen.periodoActual)}` : ''} (${Object.entries(porSucursal).map(([s, l]) => `${s} ${l.length}`).join(', ') || 'ninguno'})${excluidos ? `. ${excluidos} caso(s) de otros meses excluidos` : ''}${desconocidos.length ? `. ${lote.casos.filter(c => !c.sucursal).length} caso(s) con nombre de sucursal no reconocido: asígnalos abajo` : ''}.`});
}
function asignarNombre(origen, suc){
  almacen.equivalencias = almacen.equivalencias || {};
  almacen.equivalencias[norm(origen)] = suc;                          // queda guardada para los meses siguientes
  pendientesNombres.slice().forEach(p => { if (p.desconocidos.includes(origen)) procesarLote(p.archivo, p.lote); });
  guardar(); render();
}
// Al cargar un prestador que trae todas las sucursales, las sucursales sin casos quedan en 0 (no conservan casos antiguos de ese prestador)
function sucursalesDelPeriodoCarga(conCasos){ return [...new Set([...conCasos, ...Object.keys(periodo().sucursales)])]; }
function aplicarHolanda(suc, lotes, nombre){
  lotes.forEach(l => incorporar(suc, l.pr, l.casos));
  registrarArchivo(nombre, 'holanda', `${suc}: ${lotes.map(l => `${PRESTADORES[l.pr].corto} ${l.casos.length}`).join(', ')}`);
  mensajesCarga.push({ok:true, texto:`${nombre} → Holanda, ${suc}: ${lotes.map(l => `${l.casos.length} ${l.pr === 'holanda_criticos' ? 'valores críticos' : 'rechazos confirmados'}`).join(' y ')}.`});
}
function registrarArchivo(nombre, prestador, detalle){ periodo().archivos = (periodo().archivos || []).filter(a => a.nombre !== nombre); periodo().archivos.push({nombre, prestador, detalle, cargado:hoyTexto()}); }

function resultadoPrestador(casos){
  const n = casos.length;
  return {n, alerta:casos.filter(c => c.alerta === 'CUMPLE').length, seguimiento:casos.filter(c => c.seguimiento === 'CUMPLE').length,
    cumple:casos.filter(c => c.alerta === 'CUMPLE' && c.seguimiento === 'CUMPLE').length, pendientes:casos.filter(c => !c.alerta || !c.seguimiento).length};
}
function tablaResultados(suc, enDocumento){
  const fr = (a, b) => b ? `${a}/${b}` : '—';
  let filas = '';
  INDICADORES.forEach(ind => {
    let tot = {n:0, alerta:0, seguimiento:0, cumple:0, pendientes:0};
    ind.prestadores.forEach((pr, k) => {
      const r = resultadoPrestador(casosDe(suc, pr)); Object.keys(tot).forEach(x => tot[x] += r[x]);
      filas += `<tr>${k === 0 ? `<td rowspan="${ind.prestadores.length + (ind.prestadores.length > 1 ? 1 : 0)}"><strong>${esc(ind.nombre)}</strong></td>` : ''}<td>${esc(PRESTADORES[pr].corto)}</td><td class="cc">${r.n}</td><td class="cc">${fr(r.alerta, r.n)}</td><td class="cc">${fr(r.seguimiento, r.n)}</td><td class="cc"><strong>${fr(r.cumple, r.n)}</strong></td>${enDocumento ? '' : `<td class="cc">${r.pendientes ? `<span class="badge b-mal">${r.pendientes}</span>` : '<span class="badge b-ok">0</span>'}</td>`}</tr>`;
    });
    if (ind.prestadores.length > 1) filas += `<tr><td class="total">Total ${esc(ind.nombre.toLowerCase())}</td><td class="total cc">${tot.n}</td><td class="total cc">${fr(tot.alerta, tot.n)}</td><td class="total cc">${fr(tot.seguimiento, tot.n)}</td><td class="total cc"><strong>${fr(tot.cumple, tot.n)}</strong></td>${enDocumento ? '' : '<td class="total"></td>'}</tr>`;
  });
  return `<table class="${enDocumento ? '' : 'resultados'}"><thead><tr><th>Indicador</th><th>Prestador</th><th>Casos</th><th>Alerta</th><th>Seguimiento</th><th>Cumplimiento</th>${enDocumento ? '' : '<th>Pendientes</th>'}</tr></thead><tbody>${filas}</tbody></table>`;
}
const totalIndicador = (suc, ind) => ind.prestadores.reduce((t, pr) => { const r = resultadoPrestador(casosDe(suc, pr)); return {n:t.n + r.n, cumple:t.cumple + r.cumple}; }, {n:0, cumple:0});

function vistaRevision(){
  const p = periodo();
  const conDatos = SUCURSALES.filter(s => p.sucursales[s] && Object.values(p.sucursales[s].casos).some(l => l));
  if (!conDatos.length) return '<div class="notice">Aún no hay casos cargados para este período.</div>';
  if (!conDatos.includes(sucursalActiva)) sucursalActiva = conDatos[0];
  const s = sucursalDatos(sucursalActiva), bloq = !!s.cerrada;
  const casos = casosDe(sucursalActiva, prestadorActivo);
  const celda = (v, k, campo) => `<span class="celda-ev ${v === 'CUMPLE' ? 'c' : v === 'NO CUMPLE' ? 'n' : mostrarPendientes ? 'pend' : ''} ${bloq ? 'bloq' : ''}" ${bloq ? '' : `data-caso="${k}" data-campo="${campo}"`} title="1 clic: CUMPLE · 2 clics: NO CUMPLE · 3 clics: vacío">${v || '·'}</span>`;
  const conExamen = ['holanda_criticos','holanda_rechazos','eco'].includes(prestadorActivo);
  const hist = (s.historialCierre || []).map(h => `${h.accion} el ${h.fecha}${h.motivo ? ' — motivo: ' + h.motivo : ''}`);
  return `<div class="subtabs">${conDatos.map(x => `<button data-suc="${x}" class="${x === sucursalActiva ? 'on' : ''}">${x}${p.sucursales[x].cerrada ? ' (cerrada)' : ''}</button>`).join('')}</div>
    <div class="card"><div class="row"><h2>${esc(sucursalActiva)} — ${esc(mesLegible(almacen.periodoActual))}</h2><span class="spacer"></span>
      ${bloq ? `<span class="badge b-cerrada">Revisión cerrada el ${esc(s.cerrada)}</span><button class="btn sec" id="btnReabrir">Reabrir</button>` : '<button class="btn" id="btnCerrar">Cerrar revisión</button>'}
      <button class="btn sec" id="btnPDF">Descargar PDF</button><button class="btn sec" id="btnExcel">Descargar Excel</button></div>
      ${hist.length ? `<p class="small muted">Historial: ${hist.map(esc).join(' · ')}</p>` : ''}
      <div class="tabla" style="max-height:none;margin-top:.6rem">${tablaResultados(sucursalActiva, false)}</div>
      <p class="small muted">Un caso cumple solo si cumplen la alerta y el seguimiento. Estos resultados son los que se ingresan a SerQ.</p></div>
    <div class="card"><div class="subtabs">${ORDEN_PRESTADORES.map(pr => { const r = resultadoPrestador(casosDe(sucursalActiva, pr)); return `<button data-pr="${pr}" class="${pr === prestadorActivo ? 'on' : ''}">${esc(PRESTADORES[pr].corto)} (${r.n})${r.pendientes && r.n ? ' ·' : ''}</button>`; }).join('')}</div>
      <div class="row"><h3>${esc(PRESTADORES[prestadorActivo].nombre)}</h3><span class="spacer"></span>${!bloq && casos.length ? '<button class="btn sec" id="btnTodoCumple">Marcar vacíos como CUMPLE</button>' : ''}</div>
      ${casos.length ? `<div class="tabla"><table class="revision"><thead><tr><th>#</th><th>${esc(PRESTADORES[prestadorActivo].id)}</th><th>RUT</th><th>Paciente</th>${conExamen ? `<th>${prestadorActivo === 'eco' ? 'Estudio' : 'Examen'}</th>` : ''}${prestadorActivo === 'holanda_rechazos' ? '<th>Causa de rechazo</th>' : ''}<th>${prestadorActivo === 'taag' ? 'Fecha de toma' : 'Fecha atención'}</th>${prestadorActivo === 'holanda_rechazos' ? '' : '<th>Validación / envío</th>'}<th>Límite notificación (48 h)</th><th>ALERTA</th><th>SEGUIMIENTO</th><th>Resultado</th><th>Observaciones</th></tr></thead><tbody>
        ${casos.map((c, k) => { const ok = c.alerta && c.seguimiento ? (c.alerta === 'CUMPLE' && c.seguimiento === 'CUMPLE' ? '<span class="badge b-ok">CUMPLE</span>' : '<span class="badge b-mal">NO CUMPLE</span>') : '<span class="muted">Pendiente</span>';
          return `<tr><td>${k + 1}</td><td>${esc(c.id)}</td><td><strong>${esc(c.rut)}</strong></td><td>${esc(c.nombre)}</td>${conExamen ? `<td>${esc(c.examen)}</td>` : ''}${prestadorActivo === 'holanda_rechazos' ? `<td>${esc(c.causa)}</td>` : ''}<td>${esc(c.fechaAtencion)}</td>${prestadorActivo === 'holanda_rechazos' ? '' : `<td>${esc(c.validacion)}</td>`}<td>${esc(c.limite)}</td>
            <td>${celda(c.alerta, k, 'alerta')}</td><td>${celda(c.seguimiento, k, 'seguimiento')}</td><td>${ok}</td><td><input ${bloq ? 'disabled' : `data-obs="${k}"`} value="${esc(c.obs)}" placeholder="Observación" style="min-width:220px"></td></tr>`; }).join('')}
        </tbody></table></div>` : `<p class="muted">${periodo().sucursales[sucursalActiva].casos[prestadorActivo] ? 'Sin casos de este prestador para la sucursal en el período.' : 'No se ha cargado el archivo de este prestador.'}</p>`}</div>`;
}
function vistaRed(){
  const p = periodo();
  const filas = SUCURSALES.filter(s => p.sucursales[s]).map(s => `<tr><td><strong>${s}</strong> ${p.sucursales[s].cerrada ? '<span class="badge b-cerrada">Cerrada</span>' : ''}</td>${INDICADORES.map(ind => { const t = totalIndicador(s, ind); return `<td class="cc">${t.n ? `${t.cumple}/${t.n}` : '—'}</td>`; }).join('')}${ORDEN_PRESTADORES.map(pr => { const r = resultadoPrestador(casosDe(s, pr)); return `<td class="cc small">${r.n ? `${r.cumple}/${r.n}` : '—'}</td>`; }).join('')}</tr>`).join('');
  const red = INDICADORES.map(ind => SUCURSALES.reduce((t, s) => { const x = totalIndicador(s, ind); return {n:t.n + x.n, cumple:t.cumple + x.cumple}; }, {n:0, cumple:0}));
  return `<div class="card"><h2>Resultados de la red — ${esc(mesLegible(almacen.periodoActual))}</h2>
    <div class="tabla" style="max-height:none"><table><thead><tr><th>Sucursal</th>${INDICADORES.map(i => `<th>${esc(i.nombre)}</th>`).join('')}${ORDEN_PRESTADORES.map(pr => `<th class="small">${esc(PRESTADORES[pr].corto)}</th>`).join('')}</tr></thead><tbody>${filas}
      <tr><td class="total">Total red</td>${red.map(t => `<td class="total cc">${t.n ? `${t.cumple}/${t.n}` : '—'}</td>`).join('')}${ORDEN_PRESTADORES.map(pr => { const r = SUCURSALES.reduce((t, s) => { const x = resultadoPrestador(casosDe(s, pr)); return {n:t.n + x.n, c:t.c + x.cumple}; }, {n:0, c:0}); return `<td class="total cc small">${r.n ? `${r.c}/${r.n}` : '—'}</td>`; }).join('')}</tr></tbody></table></div>
    <p class="small muted">Cumplimiento = casos con alerta y seguimiento que cumplen / casos totales.</p></div>`;
}

/* ---------- PDF y Excel por sucursal ---------- */
function documentoSucursal(suc){
  const s = sucursalDatos(suc);
  const ev = v => v === 'NO CUMPLE' ? '<td class="cn">NO CUMPLE</td>' : `<td class="cc">${esc(v || '—')}</td>`;
  const hist = (s.historialCierre || []).map(h => `${h.accion} el ${h.fecha}${h.motivo ? ' (motivo: ' + h.motivo + ')' : ''}`);
  let n = 1;
  const anexos = ORDEN_PRESTADORES.map(pr => {
    const casos = casosDe(suc, pr); if (!casos.length) return '';
    const conExamen = ['holanda_criticos','holanda_rechazos','eco'].includes(pr), rech = pr === 'holanda_rechazos';
    return `<h3>ANEXO ${n++}: ${esc(PRESTADORES[pr].anexo)}</h3><table><thead><tr><th>${esc(PRESTADORES[pr].id)}</th><th>RUT</th><th>Paciente</th>${conExamen ? `<th>${pr === 'eco' ? 'Estudio' : 'Examen'}</th>` : ''}${rech ? '<th>Causa de rechazo</th>' : ''}<th>${pr === 'taag' ? 'Fecha de toma' : 'Fecha atención'}</th>${rech ? '' : '<th>Validación / envío</th>'}<th>Límite (48 h)</th><th>ALERTA</th><th>SEGUIMIENTO</th><th>Observaciones</th></tr></thead><tbody>
      ${casos.map(c => `<tr><td>${esc(c.id)}</td><td style="white-space:nowrap">${esc(c.rut)}</td><td>${esc(c.nombre)}</td>${conExamen ? `<td>${esc(c.examen)}</td>` : ''}${rech ? `<td>${esc(c.causa)}</td>` : ''}<td>${esc(c.fechaAtencion)}</td>${rech ? '' : `<td>${esc(c.validacion)}</td>`}<td>${esc(c.limite)}</td>${ev(c.alerta)}${ev(c.seguimiento)}<td>${esc(c.obs)}</td></tr>`).join('')}</tbody></table>`;
  }).join('');
  return `<div class="doc"><div style="display:flex;align-items:center;gap:12px;border-bottom:3px solid #003366;padding-bottom:5px"><img src="${LOGO_COLOR}" alt="" style="height:32px"><div><h2 style="margin:0">Contraloría de resultados críticos y muestras rechazadas</h2><div>${esc(suc)} · ${esc(mesLegible(almacen.periodoActual))}</div></div></div>
    <h3>Resultados por indicador y prestador</h3>${tablaResultados(suc, true)}
    <p style="font-size:9pt">Un caso cumple solo si cumplen la alerta y el seguimiento. ${s.cerrada ? `Revisión cerrada el ${esc(s.cerrada)}.` : 'Revisión abierta (no cerrada).'}${hist.length ? ' Historial: ' + esc(hist.join(' · ')) + '.' : ''} Generado el ${esc(hoyTexto())}.</p>
    ${anexos}</div>`;
}
function descargarPDF(){
  const cont = document.getElementById('impresion'); cont.innerHTML = documentoSucursal(sucursalActiva);
  const titulo = `Resultados_Criticos_${archivoTexto(sucursalActiva)}_${MESES[Number(almacen.periodoActual.split('-')[1]) - 1]}_${almacen.periodoActual.split('-')[0]}`;
  const anterior = document.title; document.title = titulo;
  const restaurar = () => { document.title = anterior; window.removeEventListener('afterprint', restaurar); };
  window.addEventListener('afterprint', restaurar);
  setTimeout(() => { window.print(); setTimeout(restaurar, 1500); }, 300);
}
async function descargarExcel(){
  if (typeof ExcelJS === 'undefined'){ alert('No se pudo cargar la librería de Excel. Revisa la conexión a internet.'); return; }
  const suc = sucursalActiva, libro = new ExcelJS.Workbook();
  const borde = {style:'thin', color:{argb:'FF000000'}}, bordes = {top:borde, left:borde, bottom:borde, right:borde};
  const fill = argb => ({type:'pattern', pattern:'solid', fgColor:{argb}});
  const escribir = (hoja, valores, encabezado) => { const fila = hoja.getRow(hoja.rowCount + 1); valores.forEach((v, i) => { const c = fila.getCell(i + 1); if (v !== '' && v !== null && v !== undefined) c.value = v; c.font = {name:'Arial', size:10, bold:!!encabezado}; c.border = bordes; c.alignment = {vertical:'middle', wrapText:!!encabezado};
    if (encabezado) c.fill = fill('FFE6EEF8'); else if (v === 'CUMPLE' || v === 'NO CUMPLE'){ c.fill = fill(v === 'CUMPLE' ? 'FF1F5FAD' : 'FFC00000'); c.font = {name:'Arial', size:10, bold:true, color:{argb:'FFFFFFFF'}}; c.alignment = {horizontal:'center'}; } }); return fila; };
  const hr = libro.addWorksheet('Resultados');
  hr.getRow(1).getCell(1).value = `Contraloría de resultados críticos — ${suc} — ${mesLegible(almacen.periodoActual)}`; hr.getRow(1).getCell(1).font = {name:'Arial', size:12, bold:true};
  hr.getRow(2).getCell(1).value = ' ';
  escribir(hr, ['Indicador','Prestador','Casos','Alerta','Seguimiento','Cumplimiento'], true);
  INDICADORES.forEach(ind => {
    ind.prestadores.forEach(pr => { const r = resultadoPrestador(casosDe(suc, pr)); escribir(hr, [ind.nombre, PRESTADORES[pr].corto, r.n, r.n ? `${r.alerta}/${r.n}` : '—', r.n ? `${r.seguimiento}/${r.n}` : '—', r.n ? `${r.cumple}/${r.n}` : '—']); });
    if (ind.prestadores.length > 1){ const t = totalIndicador(suc, ind); const f = escribir(hr, [ind.nombre, 'TOTAL', t.n, '', '', t.n ? `${t.cumple}/${t.n}` : '—']); f.eachCell(c => { c.font = {name:'Arial', size:10, bold:true}; c.fill = fill('FFF1F5F9'); }); }
  });
  [26, 28, 8, 12, 14, 14].forEach((w, i) => { hr.getColumn(i + 1).width = w; });
  ORDEN_PRESTADORES.forEach(pr => {
    const casos = casosDe(suc, pr); if (!casos.length) return;
    const conExamen = ['holanda_criticos','holanda_rechazos','eco'].includes(pr), rech = pr === 'holanda_rechazos';
    const h = libro.addWorksheet(PRESTADORES[pr].corto.replace(/[\\\/?*\[\]:]/g, '').slice(0, 31), {views:[{state:'frozen', ySplit:1}]});
    const enc = [PRESTADORES[pr].id, 'RUT', 'Paciente', ...(conExamen ? [pr === 'eco' ? 'Estudio' : 'Examen'] : []), ...(rech ? ['Causa de rechazo'] : []), pr === 'taag' ? 'Fecha de toma' : 'Fecha atención', ...(rech ? [] : ['Validación / envío']), 'Límite (48 h)', 'ALERTA', 'SEGUIMIENTO', 'Observaciones'];
    escribir(h, enc, true);
    casos.forEach(c => escribir(h, [c.id, c.rut, c.nombre, ...(conExamen ? [c.examen] : []), ...(rech ? [c.causa] : []), c.fechaAtencion, ...(rech ? [] : [c.validacion]), c.limite, c.alerta, c.seguimiento, c.obs]));
    enc.forEach((e, i) => { h.getColumn(i + 1).width = e === 'Paciente' ? 34 : e === 'Observaciones' ? 40 : 16; });
  });
  const buffer = await libro.xlsx.writeBuffer();
  descargarBlob(new Blob([buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), `Resultados_Criticos_${archivoTexto(suc)}_${MESES[Number(almacen.periodoActual.split('-')[1]) - 1]}_${almacen.periodoActual.split('-')[0]}.xlsx`);
}

/* ---------- Cierre, respaldo y eventos ---------- */
function cerrarRevision(){
  const faltan = ORDEN_PRESTADORES.flatMap(pr => casosDe(sucursalActiva, pr).map((c, i) => ({pr, c, i})).filter(x => !x.c.alerta || !x.c.seguimiento));
  if (faltan.length){
    mostrarPendientes = true; render();
    alert(`No se puede cerrar: faltan ${faltan.length} caso(s) por marcar.\n\n${faltan.slice(0, 12).map(x => `${PRESTADORES[x.pr].corto} — caso ${x.i + 1} (RUT ${x.c.rut}): ${[!x.c.alerta && 'Alerta', !x.c.seguimiento && 'Seguimiento'].filter(Boolean).join(' y ')}`).join('\n')}${faltan.length > 12 ? `\n… y ${faltan.length - 12} más` : ''}`);
    return;
  }
  const faltantes = ORDEN_PRESTADORES.filter(pr => !periodo().sucursales[sucursalActiva].casos[pr]).map(pr => PRESTADORES[pr].corto);
  if (faltantes.length && !confirm(`No se han cargado archivos de: ${faltantes.join(', ')}. ¿Cerrar igual?`)) return;
  if (!confirm('Al cerrar, las marcas quedan bloqueadas. Para modificarlas habrá que reabrir indicando un motivo. ¿Cerrar la revisión?')) return;
  const s = sucursalDatos(sucursalActiva); s.cerrada = hoyTexto(); s.historialCierre.push({accion:'Cerrada', fecha:s.cerrada, motivo:''});
  mostrarPendientes = false; guardar(); render();
}
function reabrirRevision(){
  const motivo = (prompt('Motivo de la reapertura (obligatorio):') || '').trim();
  if (!motivo){ alert('La reapertura requiere indicar un motivo.'); return; }
  const s = sucursalDatos(sucursalActiva); s.historialCierre.push({accion:'Reabierta', fecha:hoyTexto(), motivo}); s.cerrada = null; guardar(); render();
}
function exportarAvance(){
  almacen.ultimaExportacion = Date.now(); guardar();
  const d = new Date();
  descargarBlob(new Blob([JSON.stringify({herramienta:'resultados-criticos', exportado:hoyTexto(), periodos:almacen.periodos})], {type:'application/json'}), `Avance_Resultados_Criticos_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.json`);
}
async function importarAvance(archivo){
  try {
    const datos = JSON.parse(await archivo.text());
    if (datos.herramienta !== 'resultados-criticos' || !datos.periodos) throw new Error('El archivo no corresponde a un avance de esta herramienta.');
    for (const [per, contenido] of Object.entries(datos.periodos)){
      if (almacen.periodos[per] && !confirm(`Ya existe el período ${mesLegible(per)}. ¿Reemplazarlo con el del archivo?`)) continue;
      almacen.periodos[per] = contenido;
    }
    if (!almacen.periodoActual) almacen.periodoActual = Object.keys(almacen.periodos).sort().reverse()[0] || '';
    guardar(); render(); alert('Avance importado.');
  } catch (e){ console.error(e); alert('No se pudo importar: ' + e.message); }
}
function mantener(fn){ const y = window.scrollY, t = [...document.querySelectorAll('.tabla')].map(x => [x.scrollTop, x.scrollLeft]); fn(); render(); window.scrollTo(0, y); document.querySelectorAll('.tabla').forEach((x, i) => { if (t[i]){ x.scrollTop = t[i][0]; x.scrollLeft = t[i][1]; } }); }
function enlazar(){
  const $ = id => document.getElementById(id);
  $('selPeriodo')?.addEventListener('change', e => { almacen.periodoActual = e.target.value; mensajesCarga = []; guardar(); render(); });
  $('btnCrearPeriodo')?.addEventListener('click', () => { const v = $('nuevoPeriodo').value; if (!v) return; almacen.periodos[v] = almacen.periodos[v] || {sucursales:{}, archivos:[]}; almacen.periodoActual = v; mensajesCarga = []; guardar(); render(); });
  $('archivos')?.addEventListener('change', e => { if (e.target.files.length) cargarArchivos([...e.target.files]); });
  document.querySelectorAll('[data-asignar]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.asignar, suc = document.querySelector(`[data-asignar-suc="${i}"]`).value; if (!suc) return;
    const x = pendientesAsignar.splice(i, 1)[0]; aplicarHolanda(suc, x.lotes, x.archivo); guardar(); render();
  }));
  document.querySelectorAll('[data-asignar-nombre]').forEach(b => b.addEventListener('click', () => {
    const o = b.dataset.asignarNombre, s = [...document.querySelectorAll('[data-nombre-suc]')].find(x => x.dataset.nombreSuc === o)?.value;
    if (s) asignarNombre(o, s);
  }));
  $('btnBorrarEquiv')?.addEventListener('click', () => { if (confirm('¿Borrar las equivalencias de nombres guardadas?')){ almacen.equivalencias = {}; guardar(); render(); } });
  $('btnExportar')?.addEventListener('click', () => { exportarAvance(); render(); });
  $('importar')?.addEventListener('change', e => { const f = e.target.files[0]; if (f) importarAvance(f); });
  $('btnBorrarPeriodo')?.addEventListener('click', () => { if (!confirm(`¿Borrar todo el período ${mesLegible(almacen.periodoActual)} y sus marcas? Exporta el avance antes si lo necesitas.`)) return; delete almacen.periodos[almacen.periodoActual]; almacen.periodoActual = ''; guardar(); render(); });
  document.querySelectorAll('[data-suc]').forEach(b => b.addEventListener('click', () => { sucursalActiva = b.dataset.suc; mostrarPendientes = false; render(); }));
  document.querySelectorAll('[data-pr]').forEach(b => b.addEventListener('click', () => { prestadorActivo = b.dataset.pr; render(); }));
  document.querySelectorAll('.celda-ev[data-caso]').forEach(c => c.addEventListener('click', () => mantener(() => {
    const caso = casosDe(sucursalActiva, prestadorActivo)[+c.dataset.caso], campo = c.dataset.campo;
    caso[campo] = !caso[campo] ? 'CUMPLE' : caso[campo] === 'CUMPLE' ? 'NO CUMPLE' : ''; guardar();
  })));
  document.querySelectorAll('input[data-obs]').forEach(inp => inp.addEventListener('input', () => { casosDe(sucursalActiva, prestadorActivo)[+inp.dataset.obs].obs = inp.value; guardar(); }));
  $('btnTodoCumple')?.addEventListener('click', () => mantener(() => { casosDe(sucursalActiva, prestadorActivo).forEach(c => { c.alerta = c.alerta || 'CUMPLE'; c.seguimiento = c.seguimiento || 'CUMPLE'; }); guardar(); }));
  $('btnCerrar')?.addEventListener('click', cerrarRevision);
  $('btnReabrir')?.addEventListener('click', reabrirRevision);
  $('btnPDF')?.addEventListener('click', descargarPDF);
  $('btnExcel')?.addEventListener('click', () => descargarExcel().catch(e => { console.error(e); alert('No se pudo generar el Excel: ' + e.message); }));
}
document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => { pestana = b.dataset.tab; render(); }));
render();
</script>
</body>
</html>
